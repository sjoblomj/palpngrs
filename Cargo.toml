[package]
name = "palpngrs"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Johan Sjöblom <sjoblom.johan@gmail.com>"]
description = "Rust library for converting between Palettized images and PNGs."
license = "MIT"
repository = "https://github.com/sjoblomj/palpngrs"
documentation = "https://docs.rs/palpngrs"
readme = "README.md"
categories = ["graphics", "multimedia::encoding"]
keywords = ["graphics", "palette", "png", "sprite", "pixel-art"]

[dependencies]
image = "0.25"     # For image manipulation (PNG handling)
log = "0.4"

[dev-dependencies]
tempfile = "3.27"
